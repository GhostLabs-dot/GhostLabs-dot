<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ghost Labs — Independent R&amp;D and Software Engineering</title>
  <desc id="desc">A dark graphite banner with cyan, blue, and violet system lines and the Ghost Labs wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b14"/>
      <stop offset=".58" stop-color="#080d18"/>
      <stop offset="1" stop-color="#100c20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".48" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".22"/>
      <stop offset=".52" stop-color="#8b5cf6" stop-opacity=".09"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8aa1bb" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="1030" cy="135" r="330" fill="url(#halo)"/>
  <path d="M0 268H520L590 198H720" fill="none" stroke="url(#accent)" stroke-opacity=".48" stroke-width="1.2"/>
  <path d="M746 0V64L820 138H930L1015 53H1200" fill="none" stroke="url(#accent)" stroke-opacity=".32" stroke-width="1.2"/>
  <path d="M778 320V260L845 193H1008L1080 265H1200" fill="none" stroke="url(#accent)" stroke-opacity=".38" stroke-width="1.2"/>
  <g fill="none" stroke="url(#accent)" stroke-opacity=".58" stroke-width="1.25">
    <path d="M833 88L912 88L963 139L1034 139"/>
    <path d="M912 88L912 179L976 243L1085 243"/>
    <path d="M963 139L963 206L1016 259"/>
    <path d="M1034 139L1102 71L1170 71"/>
    <path d="M1085 243L1140 188L1190 188"/>
  </g>
  <g fill="#0a1220" stroke="url(#accent)" stroke-width="1.4">
    <circle cx="833" cy="88" r="5"/>
    <circle cx="912" cy="88" r="6"/>
    <circle cx="963" cy="139" r="5"/>
    <circle cx="1034" cy="139" r="7"/>
    <circle cx="912" cy="179" r="4"/>
    <circle cx="976" cy="243" r="5"/>
    <circle cx="1085" cy="243" r="7"/>
    <circle cx="1102" cy="71" r="4"/>
    <circle cx="1170" cy="71" r="5"/>
    <circle cx="1140" cy="188" r="4"/>
    <circle cx="1190" cy="188" r="5"/>
    <circle cx="1016" cy="259" r="4"/>
  </g>
  <g filter="url(#softGlow)">
    <circle cx="1034" cy="139" r="3" fill="#67e8f9"/>
    <circle cx="1085" cy="243" r="3" fill="#a78bfa"/>
  </g>
  <text x="74" y="67" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="3.2">INDEPENDENT R&amp;D / SOFTWARE ENGINEERING</text>
  <text x="70" y="157" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="70" font-weight="750" letter-spacing="-2.5">GHOST LABS</text>
  <rect x="75" y="183" width="62" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="75" y="220" fill="#e1e9f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500">Build intelligently. Engineer precisely. Research deeply.</text>
  <text x="75" y="282" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.25">AI SYSTEMS  ·  EVM  ·  SMART CONTRACT SECURITY  ·  DEVELOPER TOOLS</text>
  <path d="M75 308H625" stroke="url(#accent)" stroke-opacity=".6" stroke-width="1"/>
</svg>